# Builds the update tarball for a published GitHub release and attaches it. The release
# itself is authored on GitHub (tag, notes, the pre-release flag); CI only adds the
# artifact, so what you set in the release form is what devices see. Until the tarball
# is attached (a couple of minutes), devices and the installer ignore the release rather
# than showing something that cannot be installed.
#
# The tarball is the update system's whole contract with CI: dist + package.json +
# yarn.lock + .yarnrc.yml, flat at the tar root (UpdateRunner extracts with -C), and
# platform-independent because node_modules is excluded; the device installs its own.
#
# After the tarball, the Raspberry Pi image is built (pi-image/) and attached too. It
# installs that same tarball through install.mjs, so it can only run once the tarball
# exists: a separate publish-triggered workflow would race the upload.
name: Release

on:
  release:
    types: [published]
  # Build an image by hand for an existing release (the tarball must already be attached);
  # it lands as a workflow artifact, not on the release.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to bake into the image, e.g. v3.1.0
        required: true

defaults:
  run:
    working-directory: app

jobs:
  release:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the tarball asset to the release
    steps:
      - uses: actions/checkout@v4

      # Before setup-node: its yarn cache step asks `yarn --version`, and only with corepack
      # enabled does that answer the Yarn 4 pinned by package.json (else the runner's Yarn 1
      # answers and a cache directory Yarn 4 never reads gets cached).
      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: app/yarn.lock

      # A release must report the version it was built as: the device baked-in version,
      # the tag and the release dir name all derive from these two agreeing.
      - name: Version must match the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG}." >&2
            exit 1
          fi

      - run: yarn install --immutable
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true" # building needs no browser

      - run: yarn typecheck
      - run: yarn check
      - run: yarn lint
        continue-on-error: true # informational until the lint baseline is clean

      - run: yarn build

      - name: Pack the update tarball
        run: tar -czf "webkontrol-${GITHUB_REF_NAME}.tar.gz" dist package.json yarn.lock .yarnrc.yml

      # Attaches to the release that triggered the run; flag and notes stay as authored.
      - uses: softprops/action-gh-release@v2
        with:
          files: app/webkontrol-*.tar.gz

  image:
    needs: release
    # Runs after a successful tarball upload, or alone on a manual dispatch (release skipped).
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload the image asset to the release
    defaults:
      run:
        working-directory: pi-image
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      WORK_DIR: /tmp/webkontrol-image
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # for install.mjs inside the chroot
    steps:
      - uses: actions/checkout@v4

      # build.sh installs the rest (rpi-image-gen's own dependency script, QEMU, binfmt);
      # it is the same script a developer runs from WSL2, so CI and local builds agree.
      - name: Build the image
        run: bash build.sh "$TAG"

      - name: Attach to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/webkontrol-image/work/image-WebKontrol_Pi/WebKontrol_Pi.img.xz

      - name: Upload as artifact (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: WebKontrol_Pi
          path: /tmp/webkontrol-image/work/image-WebKontrol_Pi/WebKontrol_Pi.img.xz
